[package]
name = "chronicler-llm"
version = "0.1.0"
edition = "2021"
description = "Provider-neutral LLM client for Chronicler"
license.workspace = true
authors.workspace = true

[dependencies]
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio-stream = "0.1"
futures = "0.3"

[dev-dependencies]
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
dotenvy = "0.15"
